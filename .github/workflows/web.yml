name: Check game frontend

on:
  push:
    branches: ["**"]
    paths: ["web/**", "deploy.sh", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "deploy.sh", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, test, and build
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test the leaderboard client
        run: npm test

      # The same entry point the static-site publisher runs.
      - name: Build like the publisher
        working-directory: .
        run: |
          staging=$(mktemp -d)
          bash ./deploy.sh "$staging"
          ls -l "$staging"
